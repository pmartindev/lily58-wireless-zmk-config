CONFIG_ZMK_DISPLAY=y
# Match stock nice!view idle behavior; users can enable blanking in lily58.conf.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# Run LVGL on the existing display queue at 8 Hz, not on an extra timer/thread.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=125
