# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Current ZMK uses the hardware-model-v2 name for the same nice!nano v2.
  - board: nice_nano@2.0.0//zmk
    shield: lily58_left nice_view_adapter nice_view
    artifact-name: lily58_left nice_view_adapter nice_view-nice_nano_v2-zmk
  - board: nice_nano@2.0.0//zmk
    shield: lily58_right nice_view_adapter nice_view_github
    artifact-name: lily58_right nice_view_adapter nice_view_github-nice_nano_v2-zmk
